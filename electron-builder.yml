appId: com.mediaplay.app
productName: Mediaplay
directories:
  output: dist-electron
files:
  - electron/main.mjs
  - electron/preload.cjs
  - package.json
extraResources:
  - from: .next/standalone
    to: server
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"
mac:
  icon: assets/mac-icon.png
  target: dmg
win:
  icon: assets/windows-icon.ico
  target: nsis
linux:
  target: AppImage
